x-airflow-common: &airflow-common
  image: control-tower-airflow:latest
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ct_user:ct_pass@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow/src
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: control_tower
    PGUSER: ct_user
    PGPASSWORD: ct_pass
    SMTP_HOST: ${SMTP_HOST:-ct_mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alerts@controltower.local}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:15
    container_name: ct_postgres
    environment:
      POSTGRES_USER: ct_user
      POSTGRES_PASSWORD: ct_pass
      POSTGRES_DB: control_tower
    ports:
      - "5433:5432"
    volumes:
      - ct_pgdata:/var/lib/postgresql/data
      - ./docker/01_airflow_db.sql:/docker-entrypoint-initdb.d/01_airflow_db.sql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql
      - ./sql/02_day3.sql:/docker-entrypoint-initdb.d/03_day3.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct_user -d control_tower"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset:
    build:
      context: .
      dockerfile: docker/Dockerfile.superset
    image: control-tower-superset:latest
    container_name: ct_superset
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports:
      - "8088:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - superset db upgrade && (superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true) && superset init && /usr/bin/run-server.sh

  mailpit:
    image: axllent/mailpit
    container_name: ct_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  ct_pgdata:
  airflow_logs:
